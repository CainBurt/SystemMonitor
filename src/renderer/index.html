<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>System Monitor</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>

        <header>
            <h1>System Monitor</h1>
            <span id="uptime" class="muted"></span>
        </header>

        <main>
            <section class="card" id="system">
            <h2>System</h2>
            <div id="system-list"></div>
            </section>

            <section class="card gauges">
            <div class="gauge">
                <h2>CPU</h2>
                <div class="big" id="cpu-value">–</div>
                <div class="bar"><div class="fill" id="cpu-fill"></div></div>
                <canvas id="cpu-chart" width="400" height="80"></canvas>
            </div>
            <div class="gauge">
                <h2>Memory</h2>
                <div class="big" id="mem-value">–</div>
                <div class="bar"><div class="fill" id="mem-fill"></div></div>
                <div class="muted" id="mem-detail"></div>
            </div>
            </section>

            <section class="card wide">
                <div class="row"></div>
                    <h2>Electron Processes</h2>
                </div>
                <table>
                    <thead>
                    <tr>
                        <th>PID</th>
                        <th>Type</th>
                        <th>Name</th>
                        <th>Memory</th>
                        <th>Sandboxed</th>
                    </tr>
                    </thead>

                    <tbody id="process-table-body">
                    <tr>
                        <td colspan="5">Loading...</td>
                    </tr>
                    </tbody>
                </table>

                <p>
                    Collected:
                    <span id="process-timestamp">Loading...</span>
                </p>
            </section>
        </main> 
        <script src="./renderer.js"></script>
    </body>
</html>
