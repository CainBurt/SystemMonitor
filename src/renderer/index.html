<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>System Monitor</title>
    </head>
    <body>

    <h1>System Monitor</h1>

    <p>Platform: <span id="platform">Loading...</span></p>
    <p>Architecture: <span id="architecture">Loading...</span></p>
    <p>CPU cores: <span id="cpu-count">Loading...</span></p>
    <p>Total memory: <span id="total-memory">Loading...</span></p>
    <p>Free memory: <span id="free-memory">Loading...</span></p>

        <section>
            <h2>Electron Processes</h2>

            <table>
                <thead>
                <tr>
                    <th>PID</th>
                    <th>Type</th>
                    <th>Name</th>
                    <th>Memory</th>
                    <th>Sandboxed</th>
                </tr>
                </thead>

                <tbody id="process-table-body">
                <tr>
                    <td colspan="5">Loading...</td>
                </tr>
                </tbody>
            </table>

            <p>
                Collected:
                <span id="process-timestamp">Loading...</span>
            </p>
        </section>
        <script src="./renderer.js"></script>
    </body>
</html>
